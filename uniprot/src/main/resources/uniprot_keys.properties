Protein.key_md5=md5checksum, organism
# alliance-alphafold, alliance-string, alliance-chembl and go-annotation create Proteins with a
# primaryAccession and no md5checksum before uniprot runs. With only the md5 key, uniprot stored
# a second Protein per accession (23,975 in 9.2.0 rc3); sources keyed on primaryAccession then
# merged the pairs, deleting one and leaving 98,254 Gene.proteins rows on deleted ids.
Protein.key_primaryacc=primaryAccession
Organism.key_taxonid=taxonId
Synonym.key_synonym=subject, value
Publication.key_pubmed=pubMedId
DataSet.key_name=name
DataSource.key_name=name
Gene.key_primaryidentifier=primaryIdentifier
Gene.key_secondaryidentifier=secondaryIdentifier
Gene.key_symbol_org=symbol, organism
OntologyTerm.key_name_ontology=name,ontology
OntologyTerm.key_identifier=identifier
Ontology.key_name=name
